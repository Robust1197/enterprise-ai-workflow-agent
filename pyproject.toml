[project]
name = "enterprise-ai-workflow-agent"
version = "0.1.0"
description = "Auditable local-first AI workflow portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
