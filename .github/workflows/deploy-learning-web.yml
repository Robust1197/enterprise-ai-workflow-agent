name: Deploy Agent Quest Learning Web

on:
  push:
    branches: [main]
    paths:
      - 'learning-web/**'
      - '.github/workflows/deploy-learning-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agent-quest-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static learning site
        uses: actions/upload-pages-artifact@v4
        with:
          path: learning-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
